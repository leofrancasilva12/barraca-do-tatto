<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buteco do Tatto</title>
  <!-- O site abre direto no cardápio -->
  <meta http-equiv="refresh" content="0; url=cardapio.html" />
  <link rel="canonical" href="cardapio.html" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Segoe UI',system-ui,sans-serif;
      background:linear-gradient(135deg,#023e5e,#0088cc);
      color:#fff;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:20px;padding:24px;text-align:center;
    }
    .logo{
      width:200px;max-width:64vw;
      display:flex;align-items:center;justify-content:center;
    }
    .logo img{width:100%;height:auto;object-fit:contain;filter:drop-shadow(0 8px 24px rgba(0,0,0,.35))}
    .spin{
      width:34px;height:34px;border:3px solid rgba(255,255,255,.3);
      border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    p{font-size:14px;opacity:.9}
    a{color:#fff;font-weight:700}
  </style>
</head>
<body>
  <div class="logo"><img src="assets/logo-white.png" alt="Buteco do Tatto" /></div>
  <div class="spin"></div>
  <p>Abrindo o cardápio… <a href="cardapio.html">toque aqui</a> se não redirecionar.</p>
  <script>window.location.replace('cardapio.html');</script>
</body>
</html>
