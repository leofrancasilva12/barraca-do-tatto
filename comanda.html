<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comanda — Buteco do Tatto</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/comanda.css"/>
</head>

<body>

<!-- ══════════════════════════════════════════════════════════════════
     ▼  1) HEADER — topo · logo + título + links (Cardápio / Dashboard)
     ══════════════════════════════════════════════════════════════════ -->
  <div class="top-header">
    <div class="top-header-inner">
      <div class="brand">
        <div class="brand-icon"><img src="assets/logo-white.png" alt="Buteco do Tatto"/></div>
        <div>
          <h1>Comanda</h1>
          <div class="sub">Buteco do Tatto · Stella Mares</div>
        </div>
      </div>
      <div class="nav-links">
        <a href="cardapio.html" class="nav-link">
          <svg viewBox="0 0 24 24">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
          Cardápio
        </a>
        <a href="dashboard.html" class="nav-link">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
          </svg>
          Dashboard
        </a>
      </div>
    </div>
  </div>
<!-- ▲  1) HEADER — FIM  ══════════════════════════════════════════════ -->

<!-- ══════════════════════════════════════════════════════════════════
     ▼  2) CONTEÚDO — filtros (sombreiro/busca) · status · lista de comandas
     ══════════════════════════════════════════════════════════════════ -->
  <div class="toolbar">
    <label>⛱️ Sombreiro:</label>
    <select id="mesa-filter" onchange="renderComandas()">
      <option value="all">Todos</option>
    </select>
    <div class="toolbar-spacer"></div>
    <input id="search-garcom" type="text" placeholder="🔍 Buscar garçom..." oninput="renderComandas()"
      style="background:#f0f3f8;border:1.5px solid #e0e5ee;padding:7px 12px;border-radius:8px;font-size:12px;color:var(--text);font-family:inherit;max-width:180px" />
    <button class="btn-action" onclick="openNovaMesa()">
      <svg viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      Nova Comanda
    </button>
  </div>

  <div class="status-bar">
    <span class="chip all active" data-f="all" onclick="filterStatus('all')">📋 Todas</span>
    <span class="chip aberta" data-f="aberta" onclick="filterStatus('aberta')">🟢 Abertas</span>
    <span class="chip fechada" data-f="fechada" onclick="filterStatus('fechada')">🟠 Fechadas</span>
    <span class="chip paga" data-f="paga" onclick="filterStatus('paga')">✅ Pagas</span>
  </div>

  <div class="grid" id="comandas-grid"></div>
<!-- ▲  2) CONTEÚDO — FIM  ═════════════════════════════════════════════ -->

<!-- ══════════════════════════════════════════════════════════════════
     ▼  3) MODAIS & CALCULADORA — Nova Comanda · Add Item · Pagamento · Calc
     ══════════════════════════════════════════════════════════════════ -->
  <!-- Calculator FAB -->
  <button class="calc-fab" onclick="toggleCalc()" title="Calculadora">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="2" width="16" height="20" rx="2.5" />
      <rect x="7" y="5" width="10" height="3.5" rx="1" fill="currentColor" stroke="none" />
      <circle cx="8.5" cy="12.5" r="1.1" fill="currentColor" stroke="none" />
      <circle cx="12" cy="12.5" r="1.1" fill="currentColor" stroke="none" />
      <circle cx="15.5" cy="12.5" r="1.1" fill="currentColor" stroke="none" />
      <circle cx="8.5" cy="17" r="1.1" fill="currentColor" stroke="none" />
      <circle cx="12" cy="17" r="1.1" fill="currentColor" stroke="none" />
      <rect x="13.5" y="15.8" width="3" height="2.4" rx=".6" fill="currentColor" stroke="none" />
    </svg>
  </button>

  <!-- MODAL: Nova Comanda -->
  <div class="overlay" id="modal-nova" onclick="if(event.target===this)closeNovaMesa()">
    <div class="mbox">
      <div class="mhead">
        <h2>⛱️ Nova Comanda</h2>
        <button class="mx" onclick="closeNovaMesa()"><svg viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg></button>
      </div>
      <div class="mbody">
        <div class="fg"><label>Nome do Garçom *</label><input id="inp-atendente" type="text" placeholder="Ex: Carlos"
            maxlength="30" /></div>
        <div class="fg"><label>Sombreiro *</label><input id="inp-mesa" type="text" placeholder="Ex: 01, 02, VIP..."
            maxlength="10" /></div>
        <div class="fg"><label>Nome do Cliente</label><input id="inp-client" type="text" placeholder="Ex: João Silva"
            maxlength="40" /></div>
        <button class="btn-sub" onclick="criarComanda()">
          <svg viewBox="0 0 24 24"
            style="width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          Criar Comanda
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL: Adicionar Item -->
  <div class="overlay" id="modal-add" onclick="if(event.target===this)closeAddItem()">
    <div class="mbox">
      <div class="mhead">
        <h2 id="add-title">➕ Adicionar Item</h2>
        <button class="mx" onclick="closeAddItem()"><svg viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg></button>
      </div>
      <div class="mbody">
        <input class="msearch" id="add-search" type="text" placeholder="🔍 Buscar no cardápio..."
          oninput="renderMenuList()" />
        <div id="menu-list"></div>
      </div>
    </div>
  </div>

  <!-- MODAL: Pagamento -->
  <div class="overlay" id="modal-pay" onclick="if(event.target===this)closePayModal()">
    <div class="mbox">
      <div class="mhead">
        <h2>💳 Fechar Conta</h2>
        <button class="mx" onclick="closePayModal()"><svg viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg></button>
      </div>
      <div class="pix-center" id="pay-body">
        <h3 id="pay-mesa-title">Sombreiro --</h3>
        <div class="pix-total" id="pay-total-val">R$ 0,00</div>
        <!-- Forma de pagamento -->
        <div id="pay-methods"
          style="display:flex;flex-direction:column;gap:8px;margin:16px 0;max-width:280px;margin-left:auto;margin-right:auto">
          <button class="pay-method-btn" onclick="selectPayMethod('pix')">
            <span class="pm-icon">📱</span>
            <span class="pm-info"><strong>PIX</strong><small>QR Code instantâneo</small></span>
            <span class="pm-arrow">›</span>
          </button>
          <button class="pay-method-btn" onclick="selectPayMethod('debito')">
            <span class="pm-icon">💳</span>
            <span class="pm-info"><strong>Débito</strong><small>Cartão de débito</small></span>
            <span class="pm-arrow">›</span>
          </button>
          <button class="pay-method-btn" onclick="selectPayMethod('credito')">
            <span class="pm-icon">💳</span>
            <span class="pm-info"><strong>Crédito</strong><small>Cartão de crédito</small></span>
            <span class="pm-arrow">›</span>
          </button>
        </div>
        <!-- PIX detail (hidden by default) -->
        <div id="pix-detail" style="display:none">
          <div class="pix-qr" id="pix-qr-wrap"></div>
          <div class="pix-key-box">
            <span>Chave PIX:</span>
            <span class="pix-key-val">leofrancasilva13@gmail.com</span>
          </div>
          <button class="btn-copy" onclick="copyPixKey()">📋 Copiar Copia e Cola</button>
          <div class="pix-btns">
            <button class="btn-confirm" id="btn-pay-confirm">✅ Confirmar Pagamento</button>
            <button class="btn-cancel" onclick="backToMethods()">← Voltar</button>
          </div>
        </div>
        <!-- Card confirm (hidden by default) -->
        <div id="card-detail" style="display:none">
          <div style="font-size:48px;margin:10px 0">💳</div>
          <p id="card-method-label" style="font-size:14px;font-weight:700;color:var(--sub);margin-bottom:16px">Pagamento
            no Débito</p>
          <div class="pix-btns">
            <button class="btn-confirm" id="btn-card-confirm">✅ Confirmar Pagamento</button>
            <button class="btn-cancel" onclick="backToMethods()">← Voltar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: Calculator -->
  <div class="overlay" id="modal-calc" onclick="if(event.target===this)toggleCalc()">
    <div class="mbox" style="max-width:320px">
      <div class="mhead">
        <h2>🧮 Calculadora</h2>
        <button class="mx" onclick="toggleCalc()"><svg viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg></button>
      </div>
      <div class="calc-body">
        <div class="calc-display" id="calc-display">0</div>
        <div class="calc-keys">
          <button class="calc-key clear" onclick="calcClear()">C</button>
          <button class="calc-key op" onclick="calcInput('(')">(</button>
          <button class="calc-key op" onclick="calcInput(')')">)</button>
          <button class="calc-key op" onclick="calcInput('/')">÷</button>
          <button class="calc-key" onclick="calcInput('7')">7</button>
          <button class="calc-key" onclick="calcInput('8')">8</button>
          <button class="calc-key" onclick="calcInput('9')">9</button>
          <button class="calc-key op" onclick="calcInput('*')">×</button>
          <button class="calc-key" onclick="calcInput('4')">4</button>
          <button class="calc-key" onclick="calcInput('5')">5</button>
          <button class="calc-key" onclick="calcInput('6')">6</button>
          <button class="calc-key op" onclick="calcInput('-')">−</button>
          <button class="calc-key" onclick="calcInput('1')">1</button>
          <button class="calc-key" onclick="calcInput('2')">2</button>
          <button class="calc-key" onclick="calcInput('3')">3</button>
          <button class="calc-key op" onclick="calcInput('+')">+</button>
          <button class="calc-key" onclick="calcInput('0')">0</button>
          <button class="calc-key" onclick="calcInput('00')">00</button>
          <button class="calc-key" onclick="calcInput('.')">.</button>
          <button class="calc-key eq" onclick="calcEqual()">=</button>
        </div>
      </div>
    </div>
  </div>
<!-- ▲  3) MODAIS & CALCULADORA — FIM  ════════════════════════════════ -->

<!-- ══════════════════════════════════════════════════════════════════
     ▼  4) SCRIPTS (JavaScript)
     ══════════════════════════════════════════════════════════════════ -->
  <script src="js/comanda.js"></script>
</body>

</html>
